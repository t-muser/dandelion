# Global ocean 3D: MITgcm global_ocean.cs32x15. The HDF5 files hold the native
# cs32 cubed sphere; each window is regridded on the fly to a 64x128 equiangular
# grid (u/v rotation to east/north, IDW k=4, land imputation, levels folded into
# channels). Static geometry is read from <path>/grid.h5.
#
# Channels: 6 of the 15 levels, 4 fields x 6 levels + eta = 25 dynamic;
# + depth + sin/cos(day of year) = 28 input channels.
# Data: https://huggingface.co/datasets/sada-group/global-ocean-3D
#   uv run scripts/download_data.py global-ocean-3D
data:
  _target_: dandelion.data.ocean_latlon.GlobalOcean3DLatLonHDF5DataModule
  root: ${oc.env:DANDELION_DATA,./data}/global-ocean-3D
  dataset_name: global-ocean-3D
  # Wet-cell-masked per-channel stats keyed by channel name (theta_k01 ... eta)
  # for the `levels` below. Not the HF stats.yaml (per-level, land included).
  stats:
