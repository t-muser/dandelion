  levels: [1, 3, 5, 7, 10, 13]
  dim_in: 28
  dim_out: 25
  spatial_resolution: [64, 128]
  grid: equiangular
  regrid_method: idw
  regrid_k: 4
  impute_land: true
  batch_size: 2
  n_steps_input: 4
  n_steps_output: 1
  num_workers: 16
